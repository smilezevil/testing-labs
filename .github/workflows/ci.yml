name: CI Lab 9 (SUT B)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: lab-9

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package
        run: mvn -B -ntp package -DskipTests

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp test -Dtest=RentalServiceTest
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: lab-9/target/surefire-reports/

  api-tests:
    name: API tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run API tests (Spring Boot + Testcontainers)
        run: mvn -B -ntp test -Dtest=RentalApiTest
      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-report
          path: lab-9/target/surefire-reports/